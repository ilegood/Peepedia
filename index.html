<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--ROBOTS_META-->
    <meta name="description" content="다양한 새의 사진, 울음소리, 생태 정보를 한곳에 모아 보여주는 개인 온라인 새 도감, Peepedia(짹과사전)." />
    <meta name="theme-color" content="#FAF6EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Peepedia · 짹과사전</title>
    <script>
      // 첫 렌더링 전에 테마를 적용해 화면 깜빡임을 막는다.
      // 저장된 사용자 선택 > 기기 시스템 테마 순서.
      (function () {
        try {
          var saved = localStorage.getItem('peepedia-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
